name: Generate Snake Animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - main
    
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Rajshree-Chaudhari
          outputs: |
              dist/github-contribution-grid-snake.svg?color_snake=%23F7A41D&color_dots=%23ebedf0,%23ffe5b4,%23ffd27f,%23ffb347,%23F7A41D
              dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F7A41D&color_dots=%23161b22,%234a2e00,%238a5200,%23c77700,%23F7A41D
            
            
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
